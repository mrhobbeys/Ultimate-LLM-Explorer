# Zabbix agent UserParameters for the Pi Discord Bot.
# Query any field from the bot's status snapshot, e.g.:
#   zabbix_get -s 127.0.0.1 -k pibot.metric[cpu_temp_c]
#   zabbix_get -s 127.0.0.1 -k pibot.metric[loop_lag_ms]
#
# Available keys: uptime_s, guilds, latency_ms, loop_lag_ms, loop_lag_max_ms,
#   cpu_temp_c, mem_used_pct, mem_avail_kb, load1, messages_seen, mod_actions,
#   spam_trips, escalations, llm_calls, llm_cache_hits, llm_failures,
#   llm_avg_latency_ms, llm_breaker_open, bayes_spam_msgs, bayes_ham_msgs,
#   bayes_catches, bayes_ready
UserParameter=pibot.metric[*],/etc/zabbix/pibot_metric.sh "$1"
