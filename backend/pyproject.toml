[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ulle"
version = "0.1.0"
description = "Ultimate LLM Explorer backend"
requires-python = ">=3.11"
readme = "../README.md"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "sqlmodel>=0.0.14",
    "python-multipart>=0.0.9",
    "typer>=0.12",
    "rich>=13.7",
    "numpy>=1.26",
    "sentence-transformers>=2.5",
    "bertopic>=0.16",
    "faiss-cpu>=1.8",
    "tiktoken>=0.6",
    "beautifulsoup4>=4.12",
    "lxml>=5.1",
    "python-dateutil>=2.9",
    "orjson>=3.10",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.3",
    "mypy>=1.9",
]

[project.scripts]
ulle = "app.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
